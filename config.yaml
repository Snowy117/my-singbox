        - '*.cloudflare-gateway.com. IN A 162.159.36.5'
    - domain_suffix: cloudflare-gateway.com
      query_type: AAAA
      action: predefined
      answer:
        - '*.cloudflare-gateway.com. IN AAAA 2606:4700:54::a29f:2407'
        - '*.cloudflare-gateway.com. IN AAAA 2606:4700:5c::a29f:2e07'
    - domain_suffix:
        - pku.edu.cn
        - openjudge.cn
      action: route
      server: PKU-DNS
    - domain_suffix:
        - edu.cn
        - sukaka.ai6.me
        - luogu.com.cn
        - qq.com
        - servicewechat.com
        - wechat.com
        - weixin.com
        - weixinbridge.com
