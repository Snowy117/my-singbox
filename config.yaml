      action: predefined
      answer:
        - thechosen.internal. IN A 192.168.77.1
    - domain: thechosen.internal
      query_type: AAAA
      action: predefined
      answer:
        - thechosen.internal. IN AAAA fd00:1234:5678:1::1
    - domain_suffix: thechosen.internal
      query_type: A
      action: predefined
      answer:
        - '*.thechosen.internal. IN A 192.168.77.1'
    - domain_suffix: thechosen.internal
      query_type: AAAA
      action: predefined
      answer:
        - '*.thechosen.internal. IN AAAA fd00:1234:5678:1::1'
    - domain: windowtop.info
