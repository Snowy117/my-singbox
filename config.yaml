    - type: fakeip
      tag: FakeIP-DNS
      inet4_range: 198.18.0.0/15
      inet6_range: fd18:1111:1111::/64
  rules:
    - domain: qmazon.local
      query_type: A
      action: predefined
      answer:
        - qmazon.local. IN A 10.129.243.35
    - domain: qmazon.local
      query_type: AAAA
      action: predefined
      answer:
        - qmazon.local. IN AAAA 2001:da8:201:2940:f816:3eff:fe6c:178
    - domain_suffix: qmazon.local
      query_type: A
      action: predefined
      answer:
        - '*.qmazon.local. IN A 10.129.243.35'
    - domain_suffix: qmazon.local
      query_type: AAAA
      action: predefined
      answer:
        - '*.qmazon.local. IN AAAA 2001:da8:201:2940:f816:3eff:fe6c:178'
    - domain: thechosen.internal
