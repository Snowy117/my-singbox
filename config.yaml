    - domain_suffix: windowtop.info
      query_type: A
      action: predefined
      answer:
        - '*.windowtop.info. IN A 0.0.0.0'
    - domain_suffix: windowtop.info
      query_type: AAAA
      action: predefined
      answer:
        - '*.windowtop.info. IN AAAA ::'
    - domain_suffix: cloudflare-gateway.com
      query_type: A
