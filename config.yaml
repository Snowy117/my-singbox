      server: 114.114.114.110
      server_port: 53
    - type: udp
      tag: CN-DNS-Bootstrap-114-B
      server: 114.114.115.119
      server_port: 53
    - type: tls
      tag: CN-DNS-Ali
      server: dns.alidns.com
      server_port: 853
      domain_resolver: CN-DNS-Bootstrap-114-A
    - type: tls
      tag: CN-DNS-Tencent
      server: dot.pub
      server_port: 853
      domain_resolver: CN-DNS-Bootstrap-114-A
    - type: tls
