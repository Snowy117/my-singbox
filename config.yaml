    - domain_suffix:
        - edu.cn
        - sukaka.ai6.me
        - luogu.com.cn
        - qq.com
        - servicewechat.com
        - wechat.com
        - weixin.com
        - weixinbridge.com
        - qlogo.cn
        - qpic.cn
        - gtimg.cn
        - gtimg.com
      action: route
      server: CN-DNS-Ali
      client_subnet: 115.27.215.1/24
    - rule_set:
        - private
        - fakeip-filter
        - trackerslist
        - games-cn
        - microsoft-cn
        - apple-cn
        - google-cn
      action: route
      server: CN-DNS-Ali
      client_subnet: 115.27.215.1/24
    - query_type:
        - A
        - AAAA
      action: route
      server: FakeIP-DNS
    - clash_mode: direct
      action: route
      server: CN-DNS-Ali
      client_subnet: 115.27.215.1/24
    - clash_mode: global
      action: route
      server: Global-DNS-Recipes
      client_subnet: 115.27.215.1/24
    - rule_set: cn
      action: route
      server: CN-DNS-Ali
      client_subnet: 115.27.215.1/24
    - rule_set: proxy
      action: route
      server: Global-DNS-Recipes
      client_subnet: 115.27.215.1/24
  final: Global-DNS-Cloudflare-Gateway
  strategy: prefer_ipv6
  reverse_mapping: true
  cache_capacity: 2048

inbounds:
  - type: tun
    tag: tun-in
    interface_name: Meta
    mtu: 1480
    address:
      - 198.18.0.1/30
      - fd18:1111:1111::1/126
    dns_mode: hijack
    dns_address:
      - 198.18.0.2
      - fd18:1111:1111::2
    stack: mixed
    auto_route: false
    strict_route: false
    include_interface:
      - vEthernet (E1)
      - 以太网
      - WLAN
    route_exclude_address:
      - 127.0.0.0/8
      - ::1/128
  - type: mixed
    tag: mixed-in-v4
    listen: 0.0.0.0
    listen_port: 30890
    users:
      - Username: __RUNTIME_MIXED_USERS__
        Password: __RUNTIME_MIXED_USERS__
  - type: mixed
    tag: mixed-in-v6
    listen: '::'
    listen_port: 30890
    users:
      - Username: __RUNTIME_MIXED_USERS__
        Password: __RUNTIME_MIXED_USERS__
  - type: direct
    tag: dns-in-v4
    listen: 0.0.0.0
    listen_port: 53
    reuse_addr: true
  - type: direct
    tag: dns-in-v6
    listen: '::'
    listen_port: 53
    reuse_addr: true

outbounds:
  - type: selector
    tag: 节点选择
    outbounds:
      - 香港节点
      - 新加坡节点
      - 日本节点
      - 台湾节点
      - 美国节点
      - 欧洲节点
